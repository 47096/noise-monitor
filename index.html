<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Noise Monitor">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Noise Monitor</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="monitor" aria-labelledby="app-title">
        <header class="app-header">
          <div class="mark" aria-hidden="true">
            🤫
          </div>
          <div>
            <h1 id="app-title">Noise Monitor</h1>
            <p>Live level on top. Set the alert threshold below.</p>
          </div>
        </header>

        <div class="status-row">
          <div id="statusPill" class="status-pill idle" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">Ready</span>
          </div>
        </div>

        <div class="level-panel">
          <div class="live-level">
            <span class="live-level-label">Level</span>
            <span class="volume-number" id="volumeNumber">0</span>
            <span class="unit">/ 100</span>
          </div>
          <canvas id="waveformChart" class="waveform-chart" aria-hidden="true"></canvas>
          <div class="live-meter" aria-hidden="true">
            <div class="live-meter-fill" id="trackFill"></div>
          </div>
        </div>

        <div class="threshold-slider-wrap">
          <label for="thresholdSlider" class="threshold-label">Alert at: <span id="thresholdValue">30</span></label>
          <div class="slider-track-container">
            <div class="slider-track-bg"></div>
            <div class="slider-track-fill" id="thresholdFill"></div>
            <input type="range" id="thresholdSlider" class="threshold-slider" min="1" max="100" value="30">
          </div>
        </div>

        <div class="message-input-wrap">
          <label for="alertMessage" class="message-label">Personalised Message</label>
          <input type="text" id="alertMessage" class="alert-message-input" value="Quiet" placeholder="Enter Message">
        </div>

        <div id="permissionNote" class="permission-note" hidden></div>

        <footer class="actions">
          <button id="startButton" class="primary-button" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            <span>Start</span>
          </button>
        </footer>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
