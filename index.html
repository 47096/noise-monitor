<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Noise Monitor">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Noise Monitor</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="monitor" aria-labelledby="app-title">
        <header class="app-header">
          <h1 id="app-title">Noise Monitor</h1>
          <div class="status-row">
            <div id="statusPill" class="status-pill idle" role="status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="statusText">Ready</span>
            </div>
          </div>
        </header>

        <div class="hero">
          <div class="hero-glow" aria-hidden="true"></div>
          <div class="live-level">
            <span class="volume-number" id="volumeNumber">0</span>
            <span class="unit">dB</span>
          </div>
          <p class="level-word" id="levelWord">Quiet</p>
          <p class="level-caption">Ambient noise</p>
          <canvas id="waveformChart" class="waveform-chart" aria-hidden="true"></canvas>
          <div class="live-meter" aria-hidden="true">
            <div class="live-meter-fill" id="trackFill"></div>
          </div>
        </div>

        <div class="threshold-block">
          <label for="thresholdSlider" class="threshold-label">Alert at</label>
          <p class="threshold-readout"><span id="thresholdValue">30</span><span class="unit">dB</span></p>
          <div class="slider-track-container">
            <div class="slider-track-bg"></div>
            <div class="slider-track-fill" id="thresholdFill"></div>
            <input type="range" id="thresholdSlider" class="threshold-slider" min="1" max="100" value="30">
          </div>
          <div class="range-labels" aria-hidden="true">
            <span>1</span>
            <span>100</span>
          </div>
        </div>

        <div class="message-row">
          <span class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 6.5 6.5 0 0 0 21 14.5z"/></svg>
          </span>
          <input type="text" id="alertMessage" class="alert-message-input" value="Quiet" placeholder="Enter Message" aria-label="Personalised Message">
          <span class="row-trailing" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </span>
        </div>

        <div class="alert-style-card" role="group" aria-label="Alert style">
          <label class="style-row" for="soundToggle">
            <span class="row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            </span>
            <span class="style-copy">
              <span class="style-title">Sound</span>
              <span class="style-desc">Play an alert tone</span>
            </span>
            <input type="checkbox" id="soundToggle" checked>
            <span class="switch-ui" aria-hidden="true"></span>
          </label>
          <div class="style-divider" aria-hidden="true"></div>
          <label class="style-row" for="speakToggle">
            <span class="row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-5.5A8 8 0 1 1 21 12z"/></svg>
            </span>
            <span class="style-copy">
              <span class="style-title">Speak</span>
              <span class="style-desc">Voice alert when triggered</span>
            </span>
            <input type="checkbox" id="speakToggle" checked>
            <span class="switch-ui" aria-hidden="true"></span>
          </label>
        </div>

        <div id="permissionNote" class="permission-note" hidden></div>

        <footer class="actions">
          <button id="startButton" class="primary-button" type="button">
            <span class="button-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
            </span>
            <span>Start monitoring</span>
          </button>
          <p class="tagline">
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l1.7 1.7L12 21.5l7.1-7.1 1.7-1.7a5 5 0 0 0 0-7.1z"/></svg>
            </span>
            Here to help you rest easy.
          </p>
        </footer>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
