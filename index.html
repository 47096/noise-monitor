<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Noise Monitor">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Noise Monitor</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="monitor" aria-labelledby="app-title">
        <header class="app-header">
          <div class="mark" aria-hidden="true">
            🤫
          </div>
          <div>
            <h1 id="app-title">Noise Monitor</h1>
            <p>Adjust the slider for noise sensitivity.</p>
          </div>
        </header>

        <div class="threshold-slider-wrap">
          <label for="thresholdSlider" class="threshold-label">Noise Level: <span id="thresholdValue">30</span></label>
          <input type="range" id="thresholdSlider" class="threshold-slider" min="0" max="100" value="30">
          <div class="current-level-indicator">Current: <span id="currentLevel">0</span></div>
        </div>

        <div id="permissionNote" class="permission-note" hidden></div>

        <footer class="actions">
          <button id="startButton" class="primary-button" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            <span>Start</span>
          </button>
        </footer>

        <section class="settings-inline">
          <h2>Alert Settings</h2>
          
          <label class="field">
            <span>Personalised Message</span>
            <input id="messageInput" type="text" value="Please keep quiet" maxlength="80" autocomplete="off" autocapitalize="sentences">
          </label>

          <div class="toggle-row">
            <label class="switch">
              <input id="speechToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Speak alert</span>
            </label>
            <label class="switch">
              <input id="beepToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Beep fallback</span>
            </label>
          </div>

          <button id="testButton" class="secondary-button" type="button">
            Test Alert
          </button>
        </section>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
