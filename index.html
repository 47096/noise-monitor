<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Noise Monitor">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Noise Monitor</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="monitor" aria-labelledby="app-title">
        <header class="app-header">
          <div class="mark" aria-hidden="true">
            🤫
          </div>
          <div>
            <h1 id="app-title">Noise Monitor</h1>
            <p>Adjust the slider for noise sensitivity.</p>
          </div>
        </header>

        <div class="readout" aria-live="polite">
          <canvas id="waveformCanvas"></canvas>
        </div>

        <div class="meter-wrap" aria-label="Current noise level">
          <div class="meter-track" id="meterTrack">
            <div id="volumeFill" class="volume-fill"></div>
            <div id="thresholdLine" class="threshold-line"></div>
          </div>
          <div class="meter-labels" aria-hidden="true">
            <span>Quiet</span>
            <span>Loud</span>
          </div>
        </div>

        <form class="settings" onsubmit="return false;">
          <label class="field">
            <span>Personalised Message</span>
            <input id="messageInput" type="text" value="Please keep quiet" maxlength="80" autocomplete="off" autocapitalize="sentences">
          </label>

          <div class="toggle-row">
            <label class="switch">
              <input id="speechToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Speak alert</span>
            </label>
            <label class="switch">
              <input id="beepToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Beep fallback</span>
            </label>
          </div>
        </form>

        <div id="permissionNote" class="permission-note" hidden></div>

        <footer class="actions">
          <button id="startButton" class="primary-button" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            <span>Start</span>
          </button>
        </footer>
      </section>
    </main>

    <button id="hiddenTestButton" class="hidden-test-button" type="button" aria-label="Settings">
      ⚙️
    </button>

    <!-- Settings Modal Overlay -->
    <div id="settingsModal" class="settings-modal" hidden>
      <div class="settings-modal-content">
        <header class="modal-header">
          <h2>Parent Settings</h2>
          <button id="closeSettingsBtn" class="close-btn" type="button" aria-label="Close settings">&times;</button>
        </header>
        
        <form class="modal-settings-form" onsubmit="return false;">
          <label class="field">
            <span>Personalised Message</span>
            <input id="modalMessageInput" type="text" value="Please keep quiet" maxlength="80" autocomplete="off" autocapitalize="sentences">
          </label>

          <div class="toggle-row">
            <label class="switch">
              <input id="modalSpeechToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Speak alert</span>
            </label>
            <label class="switch">
              <input id="modalBeepToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Beep fallback</span>
            </label>
          </div>

          <button id="modalTestButton" class="primary-button" type="button">
            Test Alert
          </button>
        </form>
      </div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
