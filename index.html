<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Noise Monitor">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Noise Monitor</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="monitor" aria-labelledby="app-title">
        <header class="app-header">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" role="img">
              <path d="M11.3 1.05A1 1 0 0 1 12 2v5h4a1 1 0 0 1 .82 1.57l-7 10A1 1 0 0 1 8 18v-5H4a1 1 0 0 1-.82-1.57l7-10a1 1 0 0 1 1.12-.38Z"></path>
            </svg>
          </div>
          <h1 id="app-title">Noise Monitor</h1>
          <p>Adjust the slider for noise sensitivity.</p>
        </header>

        <div class="volume-control" title="Threshold: 30">
          <span class="volume-emoji" role="img" aria-label="Quiet">🤫</span>
          <div class="meter-track" aria-label="Current noise level">
            <div id="volumeFill" class="volume-fill"></div>
            <input id="thresholdInput" class="volume-slider" type="range" min="0" max="100" value="30" aria-label="Volume Threshold">
          </div>
          <span class="volume-emoji" role="img" aria-label="Loud">📢</span>
        </div>

        <form class="settings" onsubmit="return false;">
          <label class="field">
            <span>Personalised Message</span>
            <input id="messageInput" type="text" value="Please keep quiet" maxlength="80" autocomplete="off" autocapitalize="sentences">
          </label>
        </form>

        <div id="permissionNote" class="permission-note" hidden></div>

        <footer class="actions">
          <button id="startButton" class="primary-button" type="button">
            <span>Start Monitoring</span>
          </button>
          <div id="statusArea" class="status-area" aria-live="polite"></div>
        </footer>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
