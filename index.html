<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef2ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Noise Monitor">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Noise Monitor</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="monitor" aria-labelledby="app-title">
        <header class="app-header">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" role="img">
              <path d="M11.3 1.05A1 1 0 0 1 12 2v5h4a1 1 0 0 1 .82 1.57l-7 10A1 1 0 0 1 8 18v-5H4a1 1 0 0 1-.82-1.57l7-10a1 1 0 0 1 1.12-.38Z"></path>
            </svg>
          </div>
          <div>
            <h1 id="app-title">Noise Monitor</h1>
            <p>Adjust the slider for noise sensitivity.</p>
          </div>
        </header>

        <div class="readout" aria-live="polite">
          <div class="volume-number">
            <span id="volumeValue">0</span>
            <span class="unit">%</span>
          </div>
          <div id="statusPill" class="status-pill idle">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">Ready</span>
          </div>
        </div>

        <div class="meter-wrap" aria-label="Current noise level">
          <div class="meter-track" id="meterTrack">
            <div id="volumeFill" class="volume-fill"></div>
            <div id="thresholdLine" class="threshold-line"></div>
          </div>
          <div class="meter-labels" aria-hidden="true">
            <span>Quiet</span>
            <span>Loud</span>
          </div>
          <p class="meter-hint">Tap or drag to set threshold</p>
        </div>

        <form class="settings" onsubmit="return false;">
          <label class="field">
            <span>Personalised Message</span>
            <input id="messageInput" type="text" value="Please keep quiet" maxlength="80" autocomplete="off" autocapitalize="sentences">
          </label>

          <label class="field">
            <span>Noise threshold <strong id="thresholdValue">30%</strong></span>
          </label>

          <div class="toggle-row">
            <label class="switch">
              <input id="speechToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Speak alert</span>
            </label>
            <label class="switch">
              <input id="beepToggle" type="checkbox" checked>
              <span class="switch-ui" aria-hidden="true"></span>
              <span>Beep fallback</span>
            </label>
          </div>
        </form>

        <div id="permissionNote" class="permission-note" hidden></div>

        <footer class="actions">
          <button id="startButton" class="primary-button" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            <span>Start</span>
          </button>
          <button id="testButton" class="secondary-button" type="button">
            Test Alert
          </button>
        </footer>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
